<!doctype html>
<html><head><meta charset="utf-8"><title>DataSage architecture</title>
<style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body>
<svg width="1000" height="610" viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .bx{fill:#fff;stroke:#222;stroke-width:1.3}
      .ag{fill:#e8f0fb;stroke:#2b5797;stroke-width:1.8}
      .gt{fill:#fff4e0;stroke:#b26b00;stroke-width:1.5}
      .ds{fill:#fff;stroke:#666;stroke-width:1.2;stroke-dasharray:5 4}
      .t{font-size:14px;font-weight:bold;fill:#111}
      .s{font-size:11.5px;fill:#444}
      .m{font-family:Menlo,Consolas,monospace;font-size:11px;fill:#333}
      .h{font-size:12px;font-weight:bold;fill:#2b5797}
      .lb{font-size:11px;font-style:italic;fill:#222}
      .ln{stroke:#222;stroke-width:1.3;fill:none}
      .dl{stroke:#666;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <!-- left column: inputs, user, state, trace -->
  <rect class="bx" x="20" y="24" width="210" height="44" rx="6"/>
  <text class="t" x="34" y="51">CSV / Excel file</text>
  <rect class="bx" x="20" y="96" width="210" height="40" rx="6"/>
  <text class="t" x="34" y="121">Analysis request</text>
  <rect class="bx" x="20" y="146" width="210" height="40" rx="6"/>
  <text class="t" x="34" y="171">Rules file (optional)</text>

  <rect class="gt" x="20" y="206" width="210" height="58" rx="6"/>
  <text class="t" x="34" y="229">User</text>
  <text class="s" x="34" y="249">approves or rejects risky fixes</text>

  <rect class="bx" x="20" y="296" width="210" height="150" rx="6"/>
  <text class="t" x="34" y="319">Session state</text>
  <text class="s" x="34" y="341">original file (read-only)</text>
  <text class="s" x="34" y="360">versions v0, v1, ... vN</text>
  <text class="s" x="34" y="379">issue list</text>
  <text class="s" x="34" y="398">change log + approvals</text>
  <text class="s" x="34" y="417">step and cost budget used</text>

  <rect class="ds" x="20" y="482" width="210" height="96" rx="6"/>
  <text class="t" x="34" y="505">Trace log (JSONL)</text>
  <text class="s" x="34" y="526">every step, tool call, error,</text>
  <text class="s" x="34" y="544">time and cost; used for</text>
  <text class="s" x="34" y="562">evaluation and monitoring</text>

  <!-- middle column: main loop -->
  <rect class="bx" x="290" y="20" width="330" height="56" rx="6"/>
  <text class="t" x="304" y="43">1. Load and profile (Python)</text>
  <text class="s" x="304" y="63">types, missing %, date-parse rate, label variants</text>

  <rect class="ag" x="290" y="106" width="330" height="66" rx="6"/>
  <text class="t" x="304" y="129">2. Planner agent (LLM, tool calling)</text>
  <text class="s" x="304" y="148">runs checks, proposes fixes with a reason</text>
  <text class="s" x="304" y="164">and risk level, answers the request</text>

  <rect class="gt" x="290" y="202" width="330" height="56" rx="6"/>
  <text class="t" x="304" y="225">3. Approval gate (code, not the model)</text>
  <text class="s" x="304" y="245">safe fix: apply · risky fix: ask the user</text>

  <rect class="bx" x="290" y="288" width="330" height="56" rx="6"/>
  <text class="t" x="304" y="311">4. Apply fix to a working copy</text>
  <text class="s" x="304" y="331">new version vN+1, entry in the change log</text>

  <rect class="bx" x="290" y="374" width="330" height="56" rx="6"/>
  <text class="t" x="304" y="397">5. Validator (Python)</text>
  <text class="s" x="304" y="417">re-run the check, reconcile rows and totals</text>

  <rect class="bx" x="290" y="500" width="330" height="56" rx="6"/>
  <text class="t" x="304" y="523">6. Analyze and write the report</text>
  <text class="s" x="304" y="543">every number comes from a tool result</text>

  <line class="ln" x1="455" y1="76" x2="455" y2="106" marker-end="url(#ah)"/>
  <line class="ln" x1="455" y1="172" x2="455" y2="202" marker-end="url(#ah)"/>
  <text class="lb" x="463" y="192">fix proposal</text>
  <line class="ln" x1="455" y1="258" x2="455" y2="288" marker-end="url(#ah)"/>
  <text class="lb" x="463" y="278">approved</text>
  <line class="ln" x1="455" y1="344" x2="455" y2="374" marker-end="url(#ah)"/>
  <line class="ln" x1="455" y1="430" x2="455" y2="500" marker-end="url(#ah)"/>
  <text class="lb" x="463" y="470">planner calls finish and</text>
  <text class="lb" x="463" y="485">no checks are failing</text>

  <!-- feedback loop -->
  <polyline class="ln" points="620,402 652,402 652,154 620,154" marker-end="url(#ah)"/>
  <text class="lb" transform="translate(667,280) rotate(90)" text-anchor="middle">observation: pass, or fail + roll back to vN</text>
  <!-- rejected fixes go back to the planner -->
  <polyline class="ln" points="290,222 274,222 274,158 290,158" marker-end="url(#ah)"/>
  <text class="lb" transform="translate(268,190) rotate(-90)" text-anchor="middle">rejected</text>

  <!-- inputs into the loop -->
  <line class="ln" x1="230" y1="46" x2="290" y2="46" marker-end="url(#ah)"/>
  <line class="ln" x1="230" y1="116" x2="290" y2="116" marker-end="url(#ah)"/>
  <polyline class="ln" points="230,166 252,166 252,132 290,132" marker-end="url(#ah)"/>
  <!-- user <-> gate -->
  <line class="ln" x1="230" y1="246" x2="290" y2="246" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- state links -->
  <line class="ln" x1="290" y1="316" x2="230" y2="316" marker-end="url(#ah)"/>
  <text class="lb" x="236" y="309">writes</text>
  <line class="dl" x1="230" y1="402" x2="290" y2="402" marker-end="url(#ah)"/>
  <text class="lb" x="238" y="395">reads</text>

  <!-- right column: tools and outputs -->
  <rect class="bx" x="700" y="20" width="280" height="318" rx="6"/>
  <text class="t" x="714" y="43">Tool library (JSON schemas)</text>
  <text class="h" x="714" y="68">Check tools</text>
  <text class="m" x="714" y="86">missing, duplicates,</text>
  <text class="m" x="714" y="101">label_variants, dates,</text>
  <text class="m" x="714" y="116">numeric_range, cross_column</text>
  <text class="h" x="714" y="141">Fix tools (working copy only)</text>
  <text class="m" x="714" y="159">normalize_labels, drop_duplicates,</text>
  <text class="m" x="714" y="174">parse_dates, cast_numeric,</text>
  <text class="m" x="714" y="189">flag_rows, exclude_rows</text>
  <text class="h" x="714" y="214">Analysis tools</text>
  <text class="m" x="714" y="232">analyze(group_by, metric, agg, filter)</text>
  
  <text class="m" x="714" y="250">run_pandas (sandbox, read-only)</text>
  <text class="h" x="714" y="287">Knowledge and control</text>
  <text class="m" x="714" y="305">lookup_rule(column)</text>
  <text class="m" x="714" y="320">ask_user, finish</text>

  <line class="ln" x1="620" y1="122" x2="700" y2="122" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="lb" x="626" y="114">tool calls</text>
  <text class="lb" x="630" y="138">results</text>

  <rect class="bx" x="700" y="420" width="280" height="168" rx="6"/>
  <text class="t" x="714" y="443">Outputs</text>
  <text class="s" x="714" y="466">quality report (each issue and what was done)</text>
  <text class="s" x="714" y="486">change log with reasons and approvals</text>
  <text class="s" x="714" y="506">cleaned copy (original never changed)</text>
  <text class="s" x="714" y="526">answer table and short summary</text>
  <text class="s" x="714" y="546">replay script (plain pandas)</text>
  <text class="s" x="714" y="566">list of unresolved issues, if any</text>
  <line class="ln" x1="620" y1="528" x2="700" y2="528" marker-end="url(#ah)"/>
</svg>
</body></html>
